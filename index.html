<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery Page</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="font-sans bg-gray-100">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50" data-aos="fade-down">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">My Portofolio</h1>
      <nav class="space-x-6 text-gray-700 font-medium">
        <a href="#" class="hover:text-blue-600">Home</a>
        <a href="#" class="hover:text-blue-600">About</a>
        <a href="#" class="hover:text-blue-600">Porto</a>
        <a href="#" class="hover:text-blue-600">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Cover Sections -->
  <section class="relative w-full min-h-[866px] overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-2.png" alt="Cover 1" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-3.png" alt="Cover 2" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-4.png" alt="Cover 3" class="w-full h-auto object-cover">
    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-6">
      <a href="#"><img src="images/gmail.png" alt="Gmail" class="w-10 h-10" data-aos="zoom-in" data-aos-delay="200"></a>
      <a href="#"><img src="images/whatsapp.png" alt="WhatsApp" class="w-10 h-10" data-aos="zoom-in" data-aos-delay="400"></a>
      <a href="#"><img src="images/linkedin.png" alt="LinkedIn" class="w-10 h-10" data-aos="zoom-in" data-aos-delay="600"></a>
    </div>
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-9.png" alt="Cover 4" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-6.png" alt="Cover 5" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-5.png" alt="Cover 6" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-8.png" alt="Cover 7" class="w-full h-auto object-cover">
  </section>

  <section class="relative w-full overflow-hidden" data-aos="fade-up">
    <img src="images/desktop-7.png" alt="Cover 8" class="w-full h-auto object-cover">
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-gray-200 mt-10" data-aos="fade-up">
    <div class="max-w-7xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
      <div>
        <h3 class="text-lg font-semibold mb-2">Address</h3>
        <p>Jl. Prisma<br>Depok, Indonesia 16433</p>
      </div>
      <div>
        <h3 class="text-lg font-semibold mb-2">Contact</h3>
        <p>Email: muhammad.adiiitya@gmail.com<br>Phone: +62 822 9976 8398</p>
      </div>
      <div>
        <h3 class="text-lg font-semibold mb-2">Active Hours</h3>
        <p>Open 24 Hour 7 Days a Week</p>
      </div>
    </div>
    <div class="text-center py-4 bg-gray-900 text-xs">&copy; 2025 MyGallery. All rights reserved.</div>
  </footer>

  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true, // animasi hanya terjadi sekali saat scroll ke elemen
      duration: 1000, // durasi default 1 detik
    });
  </script>
</body>
</html>
